services:
  compose-dev-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/postgres:16-alpine"
    command:
      - "-c"
      - "wal_level=logical"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    networks:
      - "aspire"
  kafka:
    image: "docker.io/confluentinc/confluent-local:8.1.1"
    environment:
      KAFKA_LISTENERS: "PLAINTEXT://localhost:29092,CONTROLLER://localhost:29093,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092,PLAINTEXT_INTERNAL://kafka:9093"
    expose:
      - "9092"
      - "9093"
    networks:
      - "aspire"
  schema-registry:
    image: "confluentinc/cp-schema-registry:7.6.1"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9093"
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://schema-registry:8081"
    expose:
      - "8081"
    networks:
      - "aspire"
  kafka-connect:
    image: "${KAFKA_CONNECT_IMAGE}"
    environment:
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9093"
      CONNECT_GC_LOG_ENABLED: "false"
      CONNECT_HEAP_OPTS: "-Xms256M -Xmx256M"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: "8083"
      CONNECT_GROUP_ID: "docker-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "docker-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "docker-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "docker-connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_LOG_LEVEL: "info"
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    expose:
      - "8083"
    networks:
      - "aspire"
  todosapi:
    image: "${TODOSAPI_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${TODOSAPI_PORT}"
      ConnectionStrings__todos: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=todos"
      TODOS_HOST: "postgres"
      TODOS_PORT: "5432"
      TODOS_USERNAME: "postgres"
      TODOS_PASSWORD: "${POSTGRES_PASSWORD}"
      TODOS_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/todos"
      TODOS_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/todos"
      TODOS_DATABASENAME: "todos"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dev-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "todosapi"
    expose:
      - "${TODOSAPI_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      todosapi-migrations:
        condition: "service_started"
    networks:
      - "aspire"
  todosapi-migrations:
    image: "${TODOSAPI_MIGRATIONS_IMAGE}"
    environment:
      ConnectionStrings__todos: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=todos"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
